# Publishes the site to GitHub Pages on every push to main.
#
# The tests run first and the deploy only happens if they pass, so a broken
# push cannot reach the live site. Pages is turned on by the workflow itself
# the first time it runs, so there is nothing to switch on by hand.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you redeploy from the Actions tab without pushing anything.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race. A queued one waits rather than cancelling, so
# the last push always ends up being what is live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Hand evaluator, betting engine and coach
        run: node test/engine.test.mjs

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Turns Pages on for the repository if it is not on already.
          enablement: true
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
